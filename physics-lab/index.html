<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小黑喵智慧物理实验室</title>

<style>
:root{
  --bg:#f5f7fc;
  --card:#ffffff;
  --ink:#1a2238;
  --ink2:#4a5568;
  --muted:#8892a8;
  --line:#e6eaf3;
  --accent:#4f46e5;
  --shadow:0 10px 28px rgba(34,46,90,.08);
  --shadow-hover:0 16px 40px rgba(34,46,90,.14);
  --rad:16px;
  font-size:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(920px 520px at 8% -8%,#e7ebff 0%,transparent 60%),
    radial-gradient(760px 520px at 96% 0%,#f1e9ff 0%,transparent 55%);
  background-attachment:fixed;
  color:var(--ink);
  line-height:1.6;
  min-height:100vh;
  padding:0 0 60px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ---------- header ---------- */
header.hero{
  text-align:center;
  padding:60px 0 22px;
  position:relative;
}
.cat-logo{
  width:74px;height:74px;margin:0 auto 14px;
  font-size:42px;line-height:74px;
  background:linear-gradient(150deg,#fff,#eef0ff);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  filter:drop-shadow(0 6px 16px rgba(79,70,229,.16));
}
.cat-logo.glo{animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}}
header h1{
  font-size:clamp(1.7rem,4vw,2.4rem);
  font-weight:800;
  letter-spacing:-.02em;
  color:#2b2e70;
  margin-bottom:10px;
}
header p.sub{
  color:var(--muted);
  font-size:1rem;
  max-width:560px;
  margin:0 auto;
}
.stats{
  display:flex;gap:12px;justify-content:center;
  flex-wrap:wrap;margin-top:20px;
}
.stat{
  background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:8px 18px;
  font-size:.9rem;color:var(--ink2);
  box-shadow:0 4px 12px rgba(34,46,90,.05);
}
.stat b{color:var(--accent);font-weight:700;margin-right:4px}

/* ---------- control bar ---------- */
.controls{
  position:sticky;top:12px;z-index:20;
  margin:26px 0 6px;padding:12px;
  background:rgba(255,255,255,.82);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px) saturate(160%);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;flex:1;min-width:240px}
.search{position:relative;flex:1;min-width:200px}
.search input{
  width:100%;padding:11px 14px 11px 40px;
  border:1px solid var(--line);border-radius:12px;
  background:#fbfcff;color:var(--ink);font-size:.95rem;
  outline:none;transition:border-color .25s,box-shadow .25s;
}
.search input:focus{border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(79,70,229,.10)}
.search svg{position:absolute;left:13px;top:50%;
  transform:translateY(-50%);width:18px;height:18px;
  stroke:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff;border:1px solid var(--line);
  color:var(--ink2);padding:8px 13px;border-radius:11px;
  cursor:pointer;font-size:.88rem;user-select:none;
  transition:.22s;
}
.chip b{font-weight:600;font-size:.75rem;
  background:var(--bg);border-radius:8px;padding:0 6px}
.chip:hover{border-color:var(--acc);color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);
  color:#fff;font-weight:600}
.chip.on b{background:rgba(255,255,255,.22);color:#fff}
.tools{display:flex;gap:8px}
.vbtn{
  width:42px;height:42px;border-radius:11px;cursor:pointer;
  background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted);
  transition:.22s;
}
.vbtn.on{color:var(--accent);border-color:var(--accent);
  background:#f3f4ff}
.vbtn svg{width:20px;height:20px;stroke:currentColor}

/* ---------- categories ---------- */
.cats{position:relative;z-index:1;margin-top:6px}
.cat{position:relative;margin-top:44px}
.cat-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.cat-icon{
  width:40px;height:40px;flex:0 0 auto;border-radius:12px;
  display:grid;place-items:center;font-size:22px;
  background:var(--bg-soft);color:var(--acc);
  box-shadow:inset 0 0 0 1px var(--acc-line);
}
.cat-tag{font-size:1.25rem;font-weight:750;color:var(--ink)}
.cat-count{color:var(--muted);font-size:.8rem}
.cat-line{flex:1;height:2px;border-radius:2px;
  background:var(--acc-line);opacity:.5}

/* ---------- grid card ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:16px}
.card{opacity:0;transform:translateY(18px);
  transition:opacity .5s ease,transform .5s ease}
.card.sp{opacity:1;transform:none}
.card a{
  display:block;height:100%;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--rad);overflow:hidden;
  box-shadow:0 4px 12px rgba(34,46,90,.04);
  transition:.25s;
}
.card a:hover{transform:translateY(-5px);
  border-color:var(--acc-line);
  box-shadow:var(--shadow-hover)}
.card .strip{height:5px;background:var(--acc)}
.card .body{padding:18px 18px 16px}
.card .ico{
  width:46px;height:46px;border-radius:12px;font-size:24px;
  display:grid;place-items:center;
  background:var(--bg-soft);box-shadow:inset 0 0 0 1px var(--acc-line);
}
.card h3{font-size:1.05rem;font-weight:700;margin:12px 0 6px;color:var(--ink)}
.card .key{font-size:.76rem;color:var(--acc);margin-bottom:6px}
.card p{color:var(--mut,#718096);font-size:.84rem;line-height:1.55}
.card .go{
  margin-top:14px;display:inline-flex;align-items:center;gap:6px;
  color:var(--acc);font-size:.84rem;font-weight:600;
}
.card .go span{transition:transform .25s}
.card a:hover .go span{transform:translateX(4px)}

/* ---------- list rows ---------- */
.list{display:none;flex-direction:column;gap:10px}
.list.on{display:flex}
.grid.on-card{display:grid}
a.row{
  display:flex;align-items:center;gap:16px;
  background:var(--card);border:1px solid var(--line);
  border-left:5px solid var(--acc);
  border-radius:14px;padding:14px 18px;
  text-decoration:none;color:inherit;
  box-shadow:0 3px 10px rgba(34,46,90,.04);
  transition:.22s;
}
a.row:hover{transform:translateX(6px);
  border-color:var(--acc-line);
  box-shadow:var(--shadow-hover)}
a.row .ico{
  width:42px;height:42px;flex:0 0 auto;border-radius:11px;
  font-size:22px;display:grid;place-items:center;
  background:var(--bg-soft);
}
a.row .tx{flex:1;min-width:0}
a.row h4{font-size:1rem;font-weight:650;color:var(--ink)}
a.row .key{color:var(--acc);font-size:.78rem;margin-top:2px}
a.row .arrow{flex:0 0 auto;color:var(--accent);font-size:1.1rem;
  transition:.25s}
a.row:hover .arrow{transform:translateX(5px)}

/* ---------- empty & footer ---------- */
.empty{display:none;text-align:center;color:var(--muted);
  padding:80px 0;font-size:1rem}
.empty b{display:block;font-size:2.6rem;margin-bottom:10px}
footer{
  text-align:center;color:var(--muted);font-size:.82rem;
  margin-top:64px;border-top:1px solid var(--line);
  padding-top:22px;letter-spacing:.4px;
}

@media(max-width:640px){
  header.hero{padding:40px 0 16px}
  .controls{position:static}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <div class="cat-logo glo">🐈‍⬛</div>
    <h1>小黑喵智慧物理实验室</h1>
    <p class="sub">交互式物理仿真合集 · 拖拽观察，让抽象定律触手可及</p>
    <div class="stats">
      <div class="stat"><b id="stModels">0</b>交互模型</div>
      <div class="stat"><b id="stCats">0</b>大板块</div>
      <div class="stat"><b id="stEnd">0</b>可拖拽仿真</div>
    </div>
  </header>

  <div class="controls">
    <div class="bar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
             stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.3-4.3"/>
        </svg>
        <input id="q" type="text"
          placeholder="快捷搜索模型，如：振动 / 电场 / 双缝…">
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="tools">
      <button class="vbtn on" id="gridBtn" title="卡片视图">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
             stroke-linecap="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
        </svg>
      </button>
      <button class="vbtn" id="listBtn" title="列表视图">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
             stroke-linecap="round">
          <path d="M8 6h13M8 12h13M8 18h13"/>
          <path d="M3 6h.01M3 12h.01M3 18h.01"/>
        </svg>
      </button>
    </div>
  </div>

  <main class="cats" id="cats"></main>
  <div class="empty" id="empty">
    <b>🔍</b>未找到匹配的模型，换个关键词试试吧～
  </div>

  <footer>小黑喵智慧物理实验室 · 交互动画仿真合集</footer>
</div>

<script>
/* ---------- categories ---------- */
const D='./model/';
const CATS=[
 {id:'mech',name:'力学',acc:'#d97706',

  bg:'#fdeee8',line:'#f7cfc0',icon:'⚡',
  d:'电场、磁场与电磁波'},
 {id:'wave',name:'振动和波',acc:'#2563eb',
  bg:'#e8f0fd',line:'#c3d9fb',icon:'〰️',

/* ---------- models ---------- */
const MODELS=[
 /* 力学 */

  f:'抛体运动仿真.html',
  d:'模拟抛体在重力下的轨迹与速度矢量，三种抛射方式自由切换'},
 {t:'圆周运动',c:'mech',k:'匀速 · 非匀速',i:'🎡',
  f:'圆周运动.html',d:'展示角速度与向心力变化，观察半径对轨迹的影响'},
 {t:'打点计时器测加速度',c:'mech',k:'纸带 · 逐差法',i:'🕐',
  f:'打点计时器测量加速度.html',
  d:'模拟打点纸带，用逐差法处理数据并测量加速度'},
 {t:'刚体纯滚动',c:'mech',k:'转动 · 滑动',i:'🛞',
  f:'刚体纯滚动.html',d:'演示刚体纯滚动的转轴、速度分布与动能关系'},

  f:'陀螺仪 自转与进动.html',

  f:'链条模型.html',d:'模拟链条从桌面滑落的完整动力学过程'},

  f:'带电粒子螺旋运动.html',

  f:'经典带电体系的电场.html',

  f:'电偶级子与电磁波仿真.html',
  d:'电偶极子振荡与电磁波的激发和传播过程'},
 /* 振动和波 */
 {t:'弹簧振子',c:'wave',k:'简谐振动',i:'🪃',
  f:'弹簧振子.html',
  d:'位移、速度与加速度随时间正弦变化的可视化'},
 {t:'阻尼振动',c:'wave',k:'能量耗散',i:'📉',
  f:'阻尼振动.html',d:'演示阻尼对振幅的影响，振幅指数衰减'},
 {t:'受迫振动与共振',c:'wave',k:'频率 · 振幅',i:'🎵',
  f:'受迫振动与共振.html',
  d:'研究驱动力与固有频率关系，共振现象一目了然'},
 {t:'横波与纵波的传播',c:'wave',k:'模式 · 传播',i:'🌊',
  f:'横波与纵波的传播.html',
  d:'对比横波与纵波的振动方向与传播方向关系'},
 {t:'李萨如图形',c:'wave',k:'振动合成 · 相差',i:'✖️',
  f:'李萨如图形.html',
  d:'两互相垂直简谐振动的合成曲线，调节频率比呈现丰富图形'},
 {t:'驻波的形成',c:'wave',k:'叠加 · 波节波腹',i:'〰️',
  f:'驻波的形成-增强修复版.html',
  d:'两列反向波叠加成驻波，标出波节与波腹位置'},
 {t:'多普勒效应',c:'wave',k:'波前 · 接收频率',i:'📣',
  f:'多普勒效应.html',
  d:'模拟移动声源波前压缩与拉伸，实时计算接收频率'},
 /* 热学 */
 {t:'麦克斯韦速率分布',c:'thermo',k:'分布律 · 特征速率',i:'🌡️',
  f:'麦克斯韦速率分布.html',
  d:'气体分子速率分布随温度变化，标注三种特征速率'},
 /* 光学 */
 {t:'单色与彩色衍射',c:'opt',k:'衍射 · 光谱',i:'🌈',
  f:'单色与彩色衍射仿真.html',
  d:'单缝、多缝与彩色光的衍射条纹与强度分布图样'},
 {t:'牛顿环',c:'opt',k:'等厚干涉 · 光强',i:'💿',
  f:'牛顿环.html',
  d:'平凸透镜与平板间的等厚干涉，展示环形条纹与光强'},
 /* 原子物理 */
 {t:'卢瑟福散射',c:'atom',k:'库仑散射 · 核式结构',i:'🎯',
  f:'卢瑟福散射.html',
  d:'α 粒子轰击金箔，观察库仑斥力下的偏转轨迹与散射分布'},
 {t:'氢原子能级跃迁',c:'atom',k:'能级 · 光子辐射',i:'💫',
  f:'氢原子能级跃迁.html',
  d:'点击能级观察电子跃迁与光子吸收/辐射，显示波长与谱系'},
 {t:'氢原子光谱线系',c:'atom',k:'里德伯公式 · 谱线',i:'🌈',
  f:'氢原子光谱线系.html',
  d:'计算并展示莱曼/巴耳末/帕邢系谱线在波长坐标上的分布'},
 /* 量子物理 */
 {t:'光电效应',c:'quantum',k:'光子能量 · 逸出功',i:'💡',
  f:'光电效应.html',
  d:'改变光频与金属逸出功，观察是否发生光电效应与 Eₖ-f 关系'},
 {t:'一维无限深势阱',c:'quantum',k:'波函数 · 概率密度',i:'📦',
  f:'一维无限深势阱.html',
  d:'束缚态 ψₙ 与 |ψₙ|² 随量子数变化，展示能量量子化'},
 {t:'德布罗意物质波',c:'quantum',k:'λ=h/p · 驻波量子化',i:'🌊',
  f:'德布罗意物质波.html',
  d:'电子的德布罗意波长与原子尺度对比，轨道驻波量子化'},
 /* 相对论 */
 {t:'尺缩钟慢',c:'rel',k:'洛伦兹因子 · 时空',i:'⏳',
  f:'尺缩钟慢.html',
  d:'调节飞船速度，观察长度收缩与时间膨胀效应'},
 {t:'洛伦兹变换 · 时空图',c:'rel',k:'光锥 · 坐标系变换',i:'🚀',
  f:'洛伦兹变换时空图.html',
  d:'拖动事件点，直观观察它在两个惯性系中的坐标与不变量'}
];

/* ---------- state ---------- */
const MBUT='#718096';
let cur='all';
let mode='grid';
const qEl=document.getElementById('q');
const catsEl=document.getElementById('cats');
const emptyEl=document.getElementById('empty');

/* ---------- chips ---------- */
const chipsEl=document.getElementById('chips');
function buildChips(){
  let html=`<button class="chip on" data-c="all"
    style="--acc:#6366f1">全部 <b>${MODELS.length}</b></button>`;
  CATS.forEach(c=>{
    let n=MODELS.filter(m=>m.c===c.id).length;
    html+=`<button class="chip" data-c="${c.id}"
      style="--acc:${c.acc}">${c.icon} ${c.name}
      <b>${n}</b></button>`;
  });
  chipsEl.innerHTML=html;
  chipsEl.querySelectorAll('.chip').forEach(b=>{
    b.addEventListener('click',()=>{
      cur=b.dataset.c;
      chipsEl.querySelectorAll('.chip').forEach(x=>
        x.classList.toggle('on',x===b));
      render();
      scrollToCats();
    });
  });
}
function scrollToCats(){
  catsEl.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- render ---------- */
function match(m,q){
  return (m.t+m.k+m.d).toLowerCase().includes(q);
}
function cardOf(m,n){
  return `<div class="card" style="--acc:${mcol(m).acc};
    --bg-soft:${mcol(m).bg};--acc-line:${mcol(m).line};
    --mut:${mcol(m).mut}">
    <a href="${D+encodeURI(m.f)}">
      <div class="strip"></div>
      <div class="body">
        <div class="ico">${m.i}</div>
        <h3>${m.t}</h3>
        <div class="key">${m.k}</div>
        <p>${m.d}</p>
        <span class="go">进入仿真 <span>→</span></span>
      </div>
    </a></div>`;
}
function rowOf(m){
  return `<a class="row" href="${D+encodeURI(m.f)}"
    style="--acc:${mcol(m).acc};--bg-soft:${mcol(m).bg}">
    <span class="ico">${m.i}</span>
    <div class="tx"><h4>${m.t}</h4>
      <div class="key">${m.k}</div></div>
    <span class="arrow">→</span>
  </a>`;
}
function mcol(m){
  const c=CATS.find(x=>x.id===m.c)||CATS[0];
  return {acc:c.acc,bg:c.bg,line:c.line,mut:MBUT};
}
function buildCat(c,ms){
  const inner=ms.map(m=>mode==='grid'?cardOf(m):rowOf(m)).join('');
  const wcls=mode==='grid'
    ?'grid on-card':'list on';
  return `<section class="cat"
    style="--acc:${c.acc};--bg-soft:${c.bg};
      --acc-line:${c.line};--mut:${MBUT}">
    <div class="cat-head">
      <div class="cat-icon">${c.icon}</div>
      <h2 class="cat-tag">${c.name}</h2>
      <span class="cat-count">${ms.length} 个模型 · ${c.d}</span>
      <div class="cat-line"></div>
    </div>
    <div class="${wcls}">${inner}</div>
  </section>`;
}
function render(){
  const q=(qEl.value||'').trim().toLowerCase();
  const visible=CATS.filter(c=>{
    if(cur!=='all'&&c.id!==cur)return false;
    return MODELS.some(m=>m.c===c.id&&match(m,q));
  }).map(c=>{
    let ms=MODELS.filter(m=>m.c===c.id&&match(m,q));
    return buildCat(c,ms);
  }).join('');
  catsEl.innerHTML=visible;
  emptyEl.style.display=visible?'none':'block';
  requestAnimationFrame(()=>{
    document.querySelectorAll('.card').forEach((el,j)=>{
      setTimeout(()=>el.classList.add('sp'),j*40);
    });
  });
}

/* ---------- view switch ---------- */
const gridBtn=document.getElementById('gridBtn');
const listBtn=document.getElementById('listBtn');
function setMode(m){
  mode=m;
  gridBtn.classList.toggle('on',m==='grid');
  listBtn.classList.toggle('on',m==='list');
  render();
}
gridBtn.addEventListener('click',()=>setMode('grid'));
listBtn.addEventListener('click',()=>setMode('list'));
qEl.addEventListener('input',render);

/* ---------- boot ---------- */
buildChips();
document.getElementById('stModels').textContent=MODELS.length;
document.getElementById('stCats').textContent=CATS.length;
document.getElementById('stEnd').textContent=MODELS.length;
render();
</script>
</body>
</html>
