  color:var(--ink);line-height:1.65;padding:28px 16px 56px;min-height:100vh;
}
.wrap{max-width:1080px;margin:0 auto;}
header{text-align:center;margin-bottom:26px;}

  margin-bottom:6px;letter-spacing:-.02em;}
header p{color:var(--muted);font-size:.95rem;}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.14em;color:var(--accent);

  font-weight:600;margin-bottom:12px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px 20px;box-shadow:0 1px 2px rgba(22,33,58,.03),0 10px 28px -20px rgba(22,33,58,.28);
  margin-bottom:16px;}
.controls{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;}
.slider-group{display:flex;flex-direction:column;gap:5px;min-width:150px;flex:1;max-width:210px;}
.slider-group label{font-size:.78rem;color:var(--muted);font-weight:600;
  display:flex;justify-content:space-between;align-items:baseline;}
.slider-group label span{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;
  border-radius:3px;background:#e4e8f3;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:16px;height:16px;border-radius:50%;
  background:linear-gradient(140deg,var(--accent),var(--accent2));
  box-shadow:0 2px 6px -1px rgba(79,70,229,.6);cursor:pointer;transition:transform .15s;}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;
  background:linear-gradient(140deg,var(--accent),var(--accent2));
  box-shadow:0 2px 6px -1px rgba(79,70,229,.6);cursor:pointer;}
.btn-group{display:flex;gap:10px;}
.btn{border:none;padding:10px 22px;font-family:inherit;font-size:.9rem;font-weight:650;
  border-radius:10px;cursor:pointer;transition:all .18s ease;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 6px 16px -6px rgba(79,70,229,.8);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px -8px rgba(79,70,229,.9);}
.btn-ghost{background:#f1f3fa;color:var(--ink2);}
.btn-ghost:hover{background:#e8ebf5;color:var(--accent);}
.scene-panel{padding:14px;background:linear-gradient(180deg,#fafbff,#f6f8ff);}
#cv{display:block;width:100%;height:auto;border-radius:12px;}
.legend-info{display:flex;gap:20px;flex-wrap:wrap;margin-top:4px;
  padding-top:12px;border-top:1px solid var(--line);font-size:.82rem;color:var(--ink2);}
.legend-info b{color:var(--accent);font-weight:700;}
.legend-info .w{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.dot{width:16px;height:4px;border-radius:2px;display:inline-block;}
.c1{background:var(--green)}.c2{background:var(--accent)}.c3{background:var(--red)}
.np{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f59e0b;}
.nm{display:inline-block;width:2px;height:12px;background:#0e8fd8;}
.formula-row{background:linear-gradient(180deg,#fbfcff,#f5f7ff);border:1px solid #e8ecfb;
  border-radius:12px;padding:14px 18px;margin:8px 0;text-align:center;overflow-x:auto;}
.formula-row.hl{border-left:4px solid var(--accent);
  background:linear-gradient(180deg,#f8f9ff,#eef1ff);}
h3.sec{font-size:1rem;font-weight:700;margin-bottom:12px;display:flex;
  align-items:center;gap:8px;color:var(--ink);}
h3.sec::before{content:"";width:4px;height:17px;border-radius:2px;
  background:linear-gradient(180deg,var(--accent),var(--accent2));}
footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:26px;}
footer .dot{display:inline-block;width:4px;height:4px;border-radius:50%;
  background:#cbd5e1;margin:0 .55rem;vertical-align:middle;}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%;}

<script>
(function(){
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=960,H=360,mid=H/2,Ls=12;
cv.width=W;cv.height=H;
var wl=document.getElementById("wl"),sp=document.getElementById("sp");
var wlv=document.getElementById("wlv"),spv=document.getElementById("spv");
var anEl=document.getElementById("an"),ndEl=document.getElementById("nd");
var playBtn=document.getElementById("play");
var running=true,t=0,last=0;

function draw(xa,ya,color,w){
  ctx.beginPath();
  for(var i=0;i<xa.length;i++){
    if(i===0)ctx.moveTo(xa[i],ya[i]);else ctx.lineTo(xa[i],ya[i]);
  }
  ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke();
}

function arrow(x1,y1,x2,y2,color,w){
  var ang=Math.atan2(y2-y1,x2-x1),L=10,h2=8;
  ctx.strokeStyle=color;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-L*Math.cos(ang-0.42),y2-L*Math.sin(ang-0.42));
  ctx.lineTo(x2-L*Math.cos(ang+0.42),y2-L*Math.sin(ang+0.42));
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
}

function dblarrow(x,y1,y2,color,w){
  ctx.strokeStyle=color;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(x,y1+7);ctx.lineTo(x,y2-7);ctx.stroke();
  ctx.fillStyle=color;
  ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x-6,y1-9);ctx.lineTo(x+6,y1-9);
  ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(x,y2);ctx.lineTo(x-6,y2+9);ctx.lineTo(x+6,y2+9);
  ctx.closePath();ctx.fill();
}

function render(dt){
  var v=parseFloat(sp.value),l=parseFloat(wl.value);
  wlv.textContent=l.toFixed(1)+" m";
  spv.textContent=v.toFixed(2)+" m/s";
  var k=2*Math.PI/l,om=2*Math.PI*v/l,t2=t*om,amp=42,N=400;
  var inc=new Array(N+1),ref=new Array(N+1),sum=new Array(N+1);
  var px=new Array(N+1);
  for(var i=0;i<=N;i++){
    var xm=i/N*Ls;
    px[i]=i/N*W;
    inc[i]=mid+amp*Math.sin(k*xm-t2);
    ref[i]=mid+amp*Math.sin(k*xm+t2);
    sum[i]=mid+2*amp*Math.sin(k*xm)*Math.cos(t2);
  }
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#fafbff";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#e8edf8";ctx.lineWidth=1;
  for(var g=0;g<=W;g+=W/12){ctx.beginPath();ctx.moveTo(g,0);
    ctx.lineTo(g,H);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(W,mid);
  ctx.strokeStyle="#d4dbf0";ctx.stroke();
  draw(px,inc,"#10b981",2);
  draw(px,ref,"#4f46e5",2);
  draw(px,sum,"#ef4444",4);
  var an=[],nd=[],amp2=2*amp*0.9;
  for(var m=0;(m+0.5)*l/2<=Ls;m++){
    var xa=(m+0.5)*l/2,xn=m*l/2;
    var pa=xa/Ls*W,pn=xn/Ls*W;
    if(pn>6&&pn<W-6){
      ctx.beginPath();ctx.setLineDash([6,5]);
      ctx.moveTo(pn,mid-58);ctx.lineTo(pn,mid+58);
      ctx.strokeStyle="#0e8fd8";ctx.lineWidth=2;ctx.stroke();
      ctx.setLineDash([]);
      nd.push(xn.toFixed(1));
    }
    if(pa>6&&pa<W-6){
      dblarrow(pa,mid-amp2,mid+amp2,"#f59e0b",2.5);
      ctx.beginPath();ctx.arc(pa,mid,4.5,0,7);
      ctx.fillStyle="#f59e0b";ctx.fill();
      an.push(xa.toFixed(1));
    }
  }
  ctx.font="13px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillStyle="#0f9d6e";ctx.fillText("入射波 →",16,22);
  arrow(22,34,134,34,"#10b981",2.5);
  ctx.fillStyle="#4f46e5";ctx.fillText("← 反射波",W-120,76);
  arrow(W-24,60,W-134,60,"#4f46e5",2.5);
  var NP=48;
  for(var p=0;p<=NP;p++){
    var xp=p/NP*Ls,yp=mid+2*amp*Math.sin(k*xp)*Math.cos(t2);
    var qx=xp/Ls*W;
    ctx.fillStyle="rgba(51,65,85,.22)";
    ctx.beginPath();ctx.arc(qx,yp,5,0,7);ctx.fill();
    ctx.fillStyle="#334155";
    ctx.beginPath();ctx.arc(qx,yp,2.6,0,7);ctx.fill();
  }
  anEl.textContent=an.join("  ");
  ndEl.textContent=nd.join("  ");
  document.title="驻波的形成 - f="+(v/l).toFixed(2)+"Hz";
  t+=dt;
}

function loop(ts){
  var dt=(last?ts-last:16)/1000;last=ts;
  if(running)render(Math.min(dt,0.05));
  requestAnimationFrame(loop);
}
wl.addEventListener("input",function(){render(0.016);});
sp.addEventListener("input",function(){render(0.016);});
playBtn.addEventListener("click",function(){
  running=!running;playBtn.textContent=running?"播放":"暂停";
});
document.getElementById("reset").addEventListener("click",function(){
  t=0;last=0;running=true;playBtn.textContent="播放";render(0.016);
});
requestAnimationFrame(loop);
})();
</script>
